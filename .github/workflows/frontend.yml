name: Frontend
on:
  push:
    paths: ['frontend/**', 'data/punjab_2026-09-07.json', 'data/vehicle_rates.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'data/punjab_2026-09-07.json', 'data/vehicle_rates.json', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
