# Two independent jobs: `test` covers backend/ (the transport service),
# `core` covers the root-level code (the recommendation engine and the data
# pullers). The path filters are workflow-level, so they list both trees --
# a change to either runs both jobs, and each job installs what it needs.
name: CI
on:
  push:
    paths: ['backend/**', 'src/**', 'tests/**', '*.py', '.github/workflows/transport.yml']
  pull_request:
    paths: ['backend/**', 'src/**', 'tests/**', '*.py', '.github/workflows/transport.yml']

permissions:
  contents: read

jobs:
  test:
    name: Transport backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: mandiwise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mandiwise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra test
      - run: uv run ruff check src tests scripts migrations
      - run: uv run pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/mandiwise_test

  core:
    name: Recommendation engine and pullers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Nothing to install: the root tree has no pyproject, no requirements
      # and no third-party imports. tests/ uses stdlib unittest and its own
      # sys.path.insert, so pytest would be an undeclared dependency.
      # A syntax check only -- mandi_pull.py and ceda_pull.py have no tests.
      - run: python -m compileall -q demo.py mandi_pull.py ceda_pull.py src tests
      - run: python -m unittest discover -s tests -v
