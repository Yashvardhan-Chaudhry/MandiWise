[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mandiwise-transport"
version = "0.1.0"
description = "Transport estimates and identity-preserved pooling for MandiWise"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1",
  "pydantic>=2.10,<3", "PyJWT>=2.10,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
mandiwise-transport = "mandiwise_transport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mandiwise_transport = ["web/templates/*.html", "web/static/*.js", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
